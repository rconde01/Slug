<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slug GPU Text Rendering - WebGPU Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            padding: 10px 16px;
            background: #16213e;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #533483;
            z-index: 10;
        }
        #controls label {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
        }
        #textInput {
            flex: 1;
            min-width: 200px;
            padding: 6px 10px;
            background: #0f3460;
            border: 1px solid #533483;
            color: #eee;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }
        #textInput:focus {
            border-color: #e94560;
        }
        #fontInput {
            font-size: 12px;
            color: #aaa;
        }
        #colorPicker {
            width: 32px;
            height: 28px;
            border: 1px solid #533483;
            border-radius: 4px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        #canvasContainer {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 24px 32px;
            border-radius: 8px;
            max-width: 600px;
            text-align: center;
            pointer-events: none;
        }
        #overlay.error {
            background: rgba(220, 50, 50, 0.9);
            pointer-events: auto;
        }
        #overlay.info {
            background: rgba(50, 50, 80, 0.9);
            pointer-events: auto;
        }
        #overlay.hidden { display: none; }
        #status {
            position: absolute;
            bottom: 8px;
            left: 12px;
            font-size: 11px;
            color: #666;
            pointer-events: none;
        }
        #help {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 11px;
            color: #555;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label for="textInput">Text:</label>
        <input type="text" id="textInput" value="Hello Slug!" placeholder="Enter text to render...">
        <label for="colorPicker">Color:</label>
        <input type="color" id="colorPicker" value="#ffffff">
        <label for="fontInput">Font (.ttf):</label>
        <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2">
        <label for="dilationToggle" style="margin-left: 8px;">
            <input type="checkbox" id="dilationToggle"> Dynamic dilation
        </label>
    </div>
    <div id="canvasContainer">
        <canvas id="canvas"></canvas>
        <div id="overlay" class="info">Loading...</div>
        <div id="status"></div>
        <div id="help">Drag to rotate | Scroll to zoom</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
